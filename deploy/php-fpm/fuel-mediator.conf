; FuelPay Mediator PHP-FPM pool. Install as /etc/php/8.3/fpm/pool.d/fuel-mediator.conf.
; Requests can wait up to ~12 s on a slow controller (lock + timeout), so the pool must hold every terminal's
; concurrent poll plus headroom: 4-6 terminals per station, one status poll every 2 s each, plus Odoo relay calls.
[fuel-mediator]
user = fuelmed
group = fuelmed
listen = /run/php/fuel-mediator.sock
listen.owner = www-data
listen.group = www-data

pm = static
pm.max_children = 24
pm.max_requests = 2000

; Above the longest relay call (mobile_close_shift, 55 s upstream) so PHP always answers before being killed.
request_terminate_timeout = 70s

catch_workers_output = yes
php_admin_value[error_log] = /var/log/fuel-mediator/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

; Application environment comes from core-engine/.env (owned by fuelmed, mode 600).
clear_env = no
