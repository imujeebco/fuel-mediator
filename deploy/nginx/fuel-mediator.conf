# FuelPay Mediator — nginx site (Ubuntu). Install as /etc/nginx/sites-available/fuel-mediator and symlink into
# sites-enabled. Replace MEDIATOR_HOST; certbot (deploy/install.sh) adds the TLS server block and the redirect.
#
# Only the device endpoints and health are public. The monitoring UI and everything else answer 404 from outside:
# reach them through an SSH tunnel to 127.0.0.1:8081 (second server block).

upstream fuel_mediator_php {
    server unix:/run/php/fuel-mediator.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name MEDIATOR_HOST;

    root /opt/fuel-mediator/core-engine/public;
    client_max_body_size 2m;

    # FuelPay's longest call is mobile_close_shift (device timeout 60 s, relay upstream timeout 55 s).
    fastcgi_read_timeout 75s;
    fastcgi_send_timeout 75s;

    access_log /var/log/nginx/fuel-mediator.access.log;
    error_log /var/log/nginx/fuel-mediator.error.log;

    location = /odoo/jsonrpc        { include /etc/nginx/snippets/fuel-mediator-php.conf; }
    location ~ ^/stations/\d+/jsonPTS$ { include /etc/nginx/snippets/fuel-mediator-php.conf; }
    location = /health              { include /etc/nginx/snippets/fuel-mediator-php.conf; }

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}

# Monitoring UI, local only (ssh -L 8081:127.0.0.1:8081 <server>).
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /opt/fuel-mediator/core-engine/public;

    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php { include /etc/nginx/snippets/fuel-mediator-php.conf; }
}
